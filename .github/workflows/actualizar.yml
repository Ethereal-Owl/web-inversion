name: Actualizar datos y publicar la web

on:
  schedule:
    - cron: "30 5 * * 2-6"   # de martes a sábado a las 5:30 UTC (tras el cierre de cada sesión)
  workflow_dispatch:          # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Recuperar caché de CUSIP
        uses: actions/cache@v4
        with:
          path: .cache/cusip_map.json
          key: cusip-${{ github.run_id }}
          restore-keys: cusip-
      - name: Recuperar caché de operaciones de directivos
        uses: actions/cache@v4
        with:
          path: .cache/insiders_recent.json.gz
          key: insiders-${{ github.run_id }}
          restore-keys: insiders-
      - name: Comprobar el procesado
        run: python tests/test_extract.py && python tests/test_insiders.py
      - name: Descargar y procesar datos
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        shell: bash   # con pipefail: si el script falla, el paso falla
        run: python scripts/build_data.py ${{ vars.BUILD_ARGS }} 2>&1 | tee build.log
      - name: Borrar ficheros grandes temporales
        run: rm -f .cache/*.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Resumen de comprobación (al final para que se lea en la cola del registro)
        if: always()
        run: |
          grep -E "^[0-9]/6|directivos|formularios|trimestres|Listo|Traceback|Error" build.log | grep -v "^  SEC 404" | tail -40 || true
          python - <<'PY'
          import json, pathlib
          for t in ["AAPL", "MSFT", "NVDA", "KO", "BRK.B", "ASML", "NVO"]:
              p = pathlib.Path("site/data/c") / f"{t}.json"
              if not p.exists():
                  print(t, "SIN DATOS"); continue
              d = json.loads(p.read_text())
              a = d["annual"]
              print(t, d["currency"], "años", d["years"][0], "->", d["years"][-1], "| ttmEnd", d.get("ttmEnd"),
                    "| ventas", [round(x / 1e9, 1) if x else None for x in a.get("revenue", [])[-4:]],
                    "| ttm ventas", round((d["ttm"].get("revenue") or 0) / 1e9, 1),
                    "| ttm bº", round((d["ttm"].get("netIncome") or 0) / 1e9, 1),
                    "| acciones", d.get("sharesOutstanding"), "| precio", (d.get("price") or {}).get("price"),
                    "| inversores", len(d.get("holders", [])))
              ins = d.get("insiders") or {}
              print("   directivos:", len(ins.get("owners", [])), "| operaciones 12m:", ins.get("nTx"),
                    "| compras/ventas:", ins.get("nPS"), "| último formulario:", ins.get("lastFiled"))
              for o in ins.get("owners", [])[:3]:
                  print("    ", o["n"], "|", o["r"], "|", round(o["s"]), "acciones |", o["d"])
              for t in ins.get("tx", [])[:3]:
                  print("    ", t["d"], t["c"], t["n"], round(t["s"]), "a", t["p"], "->", t["o"])
          print(open("site/data/meta.json").read())
          # Copia compacta de algunas empresas (gzip + base64) para poder probar la web con datos reales fuera de Actions.
          import base64, gzip
          for t in ["NVDA", "AAPL", "TSLA", "GOOGL", "AMZN", "KO", "MSFT"]:
              p = pathlib.Path("site/data/c") / f"{t}.json"
              if p.exists():
                  d = json.loads(p.read_text())
                  d.pop("holders", None); d.pop("insiders", None)
                  print("DATOS", t, base64.b64encode(gzip.compress(json.dumps(d, separators=(",", ":")).encode())).decode())
          PY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
